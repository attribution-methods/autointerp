name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Compile Python sources
        run: |
          python -m py_compile \
            src/autointerp/*.py \
            src/autointerp/pipelines/*.py \
            src/autointerp/tools/*.py \
            src/autointerp_agent/*.py \
            scripts/validate_skills.py \
            examples/blackbox_to_validation.py \
            tests/*.py

      - name: Lint
        run: ruff check .

      - name: Type-check stable schemas and pipelines
        run: mypy src/autointerp/schemas.py src/autointerp/pipelines

      - name: Run tests
        run: pytest -q

      - name: Run end-to-end example
        run: python examples/blackbox_to_validation.py --output /tmp/autointerp-demo-report.json
