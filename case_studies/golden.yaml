  - case_id: thought-anchors-cot
    title: Thought Anchors In Token Reasoning
    question: When LLMs reason in tokens, are there load-bearing tokens or sequences of tokens in the chain-of-thought?
    visibility: public
    difficulty: hard
    evaluation_mode: hybrid
    expected_answer:
      status: hypothesis
      summary: Some chain-of-thought tokens act as load-bearing thought anchors and can be uncovered by counterfactual resampling, fork-token analysis, or simpler perturbation methods.
      acceptance_criteria:
        - Finds tokens or short spans whose replacement changes downstream reasoning more than matched controls.
        - Uses counterfactual or forked continuations rather than only saliency maps.
        - Addresses whether the model already knows the benchmark answer.
    recommended_skills:
      - black-box-auditing
      - gradient-attribution
      - activation-patching
      - causal-validation
    suggested_methods:
      - generate multiple reasoning traces
      - resample candidate tokens and continue from each fork
      - compare answer changes against random-token controls
      - patch or ablate candidate-token activations
    required_evidence:
      - forked continuations with changed final answers
      - matched controls for non-anchor tokens
      - analysis of pretraining or web-search leakage risks
    confounds:
      - model may know famous benchmark solutions from pretraining
      - chain-of-thought text may be post-hoc and not causally load-bearing
      - answer changes can come from distribution shift caused by unnatural edits
    references: []
    public_notes:
      - Prefer newer or private tasks when evaluating agents to reduce memorization.
    tags:
      - chain-of-thought
      - causal-tokens
      - counterfactual-resampling

  - case_id: surprise-vector
    title: Surprise Representation Vector
    question: How do models represent surprise in a given text?
    visibility: public
    difficulty: medium
    evaluation_mode: white_box
    expected_answer:
      status: public
      summary: A contrastive activation direction can capture surprise-like representation; it can be steered and inspected with SAE-style feature analysis.
      acceptance_criteria:
        - Builds surprise versus non-surprise prompt pairs.
        - Finds a reusable activation direction with held-out discrimination.
        - Demonstrates steering or causal effect in at least one layer range.
        - Inspects related features or nearest examples for semantic coherence.
    recommended_skills:
      - activation-cache
      - contrastive-directions
      - activation-steering
      - sparse-autoencoders
      - causal-validation
    suggested_methods:
      - mean-difference vector between surprising and unsurprising continuations
      - held-out probe or cosine-separation evaluation
      - steering sweep over layer and strength
      - SAE feature lookup near high-scoring tokens
    required_evidence:
      - held-out prompt pairs
      - direction strength/layer sweep
      - steering or intervention examples
    confounds:
      - direction may encode punctuation, sentiment, or narrative twist rather than surprise
      - examples may rely on dataset artifacts
    references:
      - title: Surprise vector tweet thread
        url: https://x.com/_lyraaaa_/status/2045373503311122712
        note: User-provided public reference for the target style of experiment.
    public_notes:
      - This is intentionally simple and should be an early white-box agent benchmark.
    tags:
      - surprise
      - activation-directions
      - steering
      - sae

